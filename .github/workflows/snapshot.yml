name: 更新官方参数库快照

# 每周一早上自动去 npm 看 @earendil-works/pi-ai 有没有新版本，
# 有就把 snapshot 文件夹换成新的并提交。没变化就什么都不做。
on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 拉取最新参数库
        run: python tools/update_snapshot.py
      - name: 更新完再跑一遍测试
        run: python -m unittest discover -s tests -t .
      - name: 有变化就提交
        run: |
          if [ -n "$(git status --porcelain snapshot)" ]; then
            version=$(python -c "import json;print(json.load(open('snapshot/VERSION'))['piAiVersion'])")
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add snapshot
            git commit -m "自动更新官方参数库快照到 pi-ai $version"
            git push
          else
            echo "快照没有变化"
          fi
