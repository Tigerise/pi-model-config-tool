name: 测试

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 跑单元测试
        run: python -m unittest discover -s tests -t . -v
      - name: 检查所有模块都能导入
        run: python -c "import main, ui, ui.app, ui.manage, ui.dialogs, ui.results, catalog, matcher, store, fetcher, tester, validator, version; print(version.title())"
